", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e55", "source": "fifo:n0376.ProceduralBlockSyntax", "target": "fifo.push", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e56", "source": "fifo:n0376.ProceduralBlockSyntax", "target": "fifo.full", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e57", "source": "fifo:n0376.ProceduralBlockSyntax", "target": "fifo.pop", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e58", "source": "fifo:n0376.ProceduralBlockSyntax", "target": "fifo.empty", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e59", "source": "fifo:n0479.IdentifierSelectNameSyntax", "target": "fifo.mem", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e60", "source": "fifo:n0485.IdentifierSelectNameSyntax", "target": "fifo.wr_ptr", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}, {"key": "e61", "source": "fifo:n0492.InvocationExpressionSyntax", "target": "fifo.DEPTH", "attributes": {"label": "reads", "color": "#0f9f6c", "size": 1.5, "predicate": "reads", "lhs_slice": null, "rhs_slice": null, "evidence_span": "", "edgeSource": "ast_experiment"}}], "legend": {"mode": "type", "type_colors": {"RTL_Module": "#000075", "Port": "#42d4f4", "Instance": "#000075", "Parameter": "#000075", "Net": "#469990", "Invocation": "#aaffc3", "ContinuousAssign": "#bfef45", "Selector": "#e6194b", "ProceduralBlock": "#ffe119"}, "community_colors": {}, "community_sizes": {}, "edge_styles": {"contains": "#e67e22", "has_register": "#d35400", "has_field": "#e88a36", "has_fsm": "#cb4335", "has_state": "#e74c3c", "has_assertion": "#a93226", "bound_into": "#9c2a1e", "instantiates": "#b34700", "part_of": "#c0392b", "collected_in": "#dc7633", "has_sample_arg": "#e06c1a", "realized_by": "#d98880", "has_ipxact_port": "#bf5a15", "has_ipxact_register": "#a04000", "has_ipxact_field": "#ba4a00", "has_bus_interface": "#d35400", "has_address_block": "#cc5a17", "contains_register": "#9c3d00", "has_ipxact_enum": "#b04508", "has_ipxact_parameter": "#c75d10", "has_ipxact_fileset": "#a64500", "has_logical_port": "#e08e2a", "has_memory_map": "#b85510", "contains_address_block": "#8a3500", "claims_about": "#e07b1f", "decomposes_into": "#c2660c", "includes": "#e59030", "passes_arg": "#f0a040", "clocked_by": "#2980b9", "reset_by": "#1f618d", "depends_on": "#2874a6", "instance_of": "#2c7fb8", "specified_by": "#3498db", "binds_parameter": "#1a5490", "constrains_clock": "#5499c7", "constrains_port": "#7fb3d5", "relative_to_clock": "#21618c", "from_endpoint": "#1b4f72", "to_endpoint": "#154360", "groups_clock": "#5dade2", "specifies": "#3a86b8", "drives": "#27ae60", "connects_to": "#229954", "transitions_to": "#1e8449", "reads": "#0f9f6c", "references": "#7f8c8d", "mentions": "#8e44ad", "references_signal": "#884ea0", "tests": "#9b59b6", "has_stage": "#76448a", "covers": "#a569bd", "has_coverpoint": "#6c3483", "has_bin": "#5b2c6f", "has_cross": "#7d3c98", "observes": "#9b6bbf", "crosses": "#bb8fce", "defined_in": "#633974", "target_entity": "#7d3c98", "enforced_by": "#884ea0", "covered_by": "#a569bd", "measured_by": "#bb8fce", "imports_dpi": "#9b7dbf", "implements_dpi": "#b89fd0", "tests_module": "#c0a0d8", "accesses_csr": "#d0b8e0", "parameterizes": "#8e5ec4", "implemented_by": "#a48bd0", "conforms_to": "#7548b3", "aggregates_port": "#9e76d9", "physical_for": "#b89be5", "exposes_memory_map": "#6f3fb0", "connects_to_address_space": "#5a2f95", "samples_covergroup": "#5b3a96", "wraps_covergroup": "#7a4fb5", "via_wrapper": "#9670c8", "defined_in_uvm_file": "#b292d8", "binds_to_arg": "#cdb3e8"}, "edge_classes": {"Composition": [{"predicate": "instantiates", "color": "#b34700"}], "Dataflow": [{"predicate": "drives", "color": "#27ae60"}, {"predicate": "reads", "color": "#0f9f6c"}]}}};

    // Build graph
    const graph = new graphology.Graph({multi: false, type: "directed"});
    graphData.nodes.forEach(n => {
      // ForceAtlas2 needs initial positions; without them every coord becomes NaN.
      const attrs = Object.assign({
        x: Math.random(),
        y: Math.random(),
      }, n.attributes);
      graph.addNode(n.key, attrs);
    });
    graphData.edges.forEach(e => {
      if (graph.hasNode(e.source) && graph.hasNode(e.target)) {
        try { graph.addEdge(e.source, e.target, e.attributes); } catch(err) {}
      }
    });

    // Layout — graphology-library@0.7 exposes layoutForceAtlas2 under graphologyLibrary
    const FA2 = graphologyLibrary.layoutForceAtlas2;
    const settings = FA2.inferSettings(graph);
    FA2.assign(graph, {settings, iterations: 200});

    // Render
    const container = document.getElementById("graph-container");
    const renderer = new Sigma(graph, container, {
      renderEdgeLabels: false,
      labelRenderedSizeThreshold: 8,
      defaultEdgeType: "arrow",
      defaultNodeType: "circle",
      enableEdgeEvents: true,
    });

    // Info
    document.getElementById("info").textContent =
      `${graph.order} nodes, ${graph.size} edges`;

    // Legend — reflect whatever coloring mode the export actually used
    const legendEl = document.getElementById("legend");
    const legend = graphData.legend;
    const isCommunity = legend.mode === "community";
    const titleText = isCommunity
      ? `Communities (top ${Object.keys(legend.community_colors).length} by size)`
      : "Entity types";
    const colorMap = isCommunity ? legend.community_colors : legend.type_colors;
    const sizes = legend.community_sizes || {};

    const title = document.createElement("div");
    title.style.fontWeight = "600";
    title.style.marginBottom = "4px";
    title.textContent = titleText;
    legendEl.appendChild(title);

    Object.entries(colorMap).forEach(([label, color]) => {
      const item = document.createElement("div");
      item.className = "legend-item";
      let display = label;
      if (isCommunity) {
        const cid = label.split(" ")[1];
        const n = sizes[cid];
        display = `${label}${n ? ` (${n})` : ""}`;
      }
      item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${display}`;
      legendEl.appendChild(item);
    });

    // Edge-predicate legend grouped by semantic class. Each class is its
    // own bold subsection (Composition / Dependency / Dataflow / Reference);
    // we skip a class entirely if no predicates of that class appear in
    // the rendered graph, so the key stays compact.
    const usedPredicates = new Set(
      graphData.edges.map(e => e.attributes && e.attributes.label).filter(Boolean)
    );
    const edgeClasses = legend.edge_classes || {};
    const classOrder = ["Composition", "Dependency", "Dataflow", "Reference"];
    classOrder.forEach(cls => {
      const entries = (edgeClasses[cls] || [])
        .filter(e => usedPredicates.has(e.predicate));
      if (entries.length === 0) return;
      const header = document.createElement("div");
      header.style.fontWeight = "700";
      header.style.fontSize = "11px";
      header.style.marginTop = "8px";
      header.style.marginBottom = "3px";
      header.textContent = cls;
      legendEl.appendChild(header);
      entries.forEach(({predicate, color}) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span style="display:inline-block;width:18px;height:3px;background:${color};margin-right:6px;vertical-align:middle;flex-shrink:0;"></span>${predicate}`;
        legendEl.appendChild(item);
      });
    });

    // Search
    const searchInput = document.getElementById("search-input");
    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase();
      graph.forEachNode((node, attrs) => {
        const match = !query || attrs.label.toLowerCase().includes(query);
        graph.setNodeAttribute(node, "hidden", !match && query.length > 0);
      });
      renderer.refresh();
    });

    // Tooltip — single tooltip surfaces node OR edge data depending on
    // what the cursor is over. Edge tooltip exposes bit-slice / evidence
    // info that only lives on edge attrs (notably for `reads` dataflow).
    const tooltip = document.getElementById("tooltip");
    const escapeHtml = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    renderer.on("enterNode", ({node}) => {
      const attrs = graph.getNodeAttributes(node);
      tooltip.innerHTML = `<b>${escapeHtml(attrs.label)}</b><br>Type: ${escapeHtml(attrs.entityType)}<br>Mentions: ${attrs.mentions}<br>Sources: ${escapeHtml(attrs.sources) || "n/a"}`;
      tooltip.style.display = "block";
    });
    renderer.on("leaveNode", () => { tooltip.style.display = "none"; });
    renderer.on("enterEdge", ({edge}) => {
      const a = graph.getEdgeAttributes(edge);
      const [s, t] = graph.extremities(edge);
      const lines = [
        `<b>${escapeHtml(s)}</b> &rarr; <b>${escapeHtml(t)}</b>`,
        `Predicate: ${escapeHtml(a.predicate || a.label)}`,
      ];
      if (a.lhs_slice || a.rhs_slice) {
        lines.push(`Slice: lhs=${escapeHtml(a.lhs_slice) || "—"} rhs=${escapeHtml(a.rhs_slice) || "—"}`);
      }
      if (a.evidence_span) {
        lines.push(`Evidence: <code>${escapeHtml(a.evidence_span)}</code>`);
      }
      if (a.edgeSource) {
        lines.push(`Source: ${escapeHtml(a.edgeSource)}`);
      }
      tooltip.innerHTML = lines.join("<br>");
      tooltip.style.display = "block";
    });
    renderer.on("leaveEdge", () => { tooltip.style.display = "none"; });
    renderer.getMouseCaptor().on("mousemove", (e) => {
      tooltip.style.left = e.x + 15 + "px";
      tooltip.style.top = e.y + 15 + "px";
    });
  </script>
