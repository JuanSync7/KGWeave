<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KGWeave AST Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="topbar">
      <h1>KGWeave AST Demo</h1>
      <span id="stats" class="muted">loading…</span>
      <div id="toolbar">
        <button id="tour-start" type="button" title="Take the guided tour">Take the tour</button>
        <button id="tour-restart" type="button" title="Restart tour from step 1">Restart tour</button>
        <button id="cookbook-open" type="button" title="Query cookbook">Query Cookbook</button>
        <button id="gallery-open" type="button" title="Use-case gallery">Use-case Gallery</button>
      </div>
      <div id="query-bar">
        <select id="query-select" aria-label="Canned query">
          <option value="">— canned query —</option>
        </select>
        <input
          id="query-freeform"
          type="text"
          placeholder='free-form: role=module | from=&lt;id&gt; via=of_module direction=rev depth=2'
          aria-label="Free-form query"
        />
        <button id="query-run" type="button">Run</button>
        <button id="query-clear" type="button">Clear</button>
      </div>
    </header>

    <main id="layout">
      <aside id="file-rail" aria-label="Corpus files"></aside>

      <section id="code-pane" aria-label="Source code"></section>

      <section id="graph-pane" aria-label="Knowledge graph">
        <div id="filters">
          <fieldset>
            <legend>Categories</legend>
            <label><input type="checkbox" data-category="semantic" checked /> semantic</label>
            <label><input type="checkbox" data-category="structural" checked /> structural</label>
            <label><input type="checkbox" data-category="blob" checked /> blob</label>
            <label><input type="checkbox" data-category="token" /> tokens (hidden by default)</label>
          </fieldset>
          <fieldset>
            <legend>Edges</legend>
            <label><input type="checkbox" data-edge="child" /> child (hidden)</label>
            <label><input type="checkbox" data-edge="semantic" checked /> semantic (drives/reads/contains…)</label>
          </fieldset>
          <fieldset>
            <legend>Layout</legend>
            <button id="relayout" type="button">re-layout (concentric)</button>
          </fieldset>
        </div>
        <div id="cy"></div>
      </section>
    </main>

    <aside id="results" aria-label="Query results">
      <header>
        <strong>Results</strong>
        <span id="results-summary" class="muted">no query yet</span>
      </header>
      <ol id="results-list"></ol>
      <div id="query-error" class="muted" hidden></div>
    </aside>

    <footer id="inspector" aria-label="Inspector">
      <em class="muted">Click a node or edge to inspect.</em>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
