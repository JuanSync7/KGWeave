[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgweave"
version = "0.1.0"
description = "Knowledge graph subsystem: entity extraction, graph storage, community detection, query expansion."
requires-python = ">=3.10"
dependencies = [
  "hjson>=3.1",
  "networkx",
  "pydantic>=2.0",
  "orjson",
  "pyyaml",
  "tree-sitter-python>=0.23.0",
  "temporalio>=1.5",
  "pyslang>=10.0.0",
  "leidenalg>=0.10",
  "python-igraph>=0.11",
  "mistune>=3.2.1",
  "kuzu>=0.11.3",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5"]
gliner = ["gliner"]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]
dev = [
  "pytest",
  "pytest-asyncio>=0.23",
  "pytest-mock",
  "pytest-timeout>=2.4.0",
  "ruff",
  "mypy",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Per-test wall-clock guard; "thread" survives asyncio + native (Kuzu mmap) code.
# basetemp is set programmatically in tests/conftest.py:pytest_configure so the
# default lands under ~/.pytest-tmp (root FS) instead of /tmp tmpfs. See
# tests/README.md for the full infra story.
timeout = 60
timeout_method = "thread"
markers = [
    "perf: wall-clock perf regression floors (slow; deselect with -m 'not perf')",
]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]
