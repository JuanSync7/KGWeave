name: demo-deploy

# SA6 deliverable: build the pyslang AST demo (graph.json), run pytest +
# Playwright E2E, then publish demo/web + demo/data to gh-pages.
#
# The site is served from https://<owner>.github.io/KGWeave/ once the user
# enables Pages in repo Settings -> Pages and points the source to the
# `gh-pages` branch (this workflow creates and pushes that branch).

on:
  push:
    branches:
      - main
      - "autoresearch/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: demo-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"

      - name: uv sync (project deps)
        run: uv sync --extra dev

      - name: Run pytest (AST experiment suite)
        run: uv run pytest research/ast_experiment/tests/ -x

      - name: Rebuild demo/data/graph.json
        run: uv run python research/ast_experiment/scripts/export_demo_graph.py

      - name: Validate demo HTML wiring
        run: uv run python research/ast_experiment/scripts/validate_demo_html.py

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright deps
        working-directory: research/ast_experiment/demo/e2e
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: research/ast_experiment/demo/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: research/ast_experiment/demo/e2e
        run: npx playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: research/ast_experiment/demo/e2e/playwright-report
          if-no-files-found: ignore

      - name: Stage GH-Pages publish directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/sv-ast-demo/data
          cp -r research/ast_experiment/demo/web/* _site/sv-ast-demo/
          cp -r research/ast_experiment/demo/data/* _site/sv-ast-demo/data/
          cp research/ast_experiment/demo/README.md _site/sv-ast-demo/README.md || true
          # Flatten relative fetch paths: locally web/ and data/ are siblings
          # (so the source uses "../data/"); deployed they're parent+child
          # under sv-ast-demo/, so "./data/" is the correct relative ref.
          find _site/sv-ast-demo -maxdepth 1 -name '*.js' -type f -print0 \
            | xargs -0 sed -i 's|\.\./data/|./data/|g'
          # Root landing page links into the demo and leaves room for future
          # KGWeave content (docs, API ref, prod UI) at sibling paths.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8" />
          <title>KGWeave</title>
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <style>
            body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
                   max-width: 720px; margin: 4rem auto; padding: 0 1rem;
                   color: #1a1d24; line-height: 1.55; }
            h1 { margin-bottom: 0.2rem; }
            .lead { color: #5b6471; margin-top: 0; }
            ul { padding-left: 1.2rem; }
            li { margin: 0.4rem 0; }
            a { color: #2c6cf2; }
            code { background: #f1f3f7; padding: 0 0.3em; border-radius: 3px; }
          </style>
          </head><body>
            <h1>KGWeave</h1>
            <p class="lead">Knowledge-graph extraction for SystemVerilog (and beyond).</p>
            <h2>Demos</h2>
            <ul>
              <li><a href="sv-ast-demo/">SystemVerilog AST demo</a> — interactive pyslang
                  knowledge graph with 1:1 code↔graph mapping, 12 canned queries,
                  freeform DSL, and guided tour.</li>
            </ul>
            <p><small>Source: <a href="https://github.com/JuanSync7/KGWeave">github.com/JuanSync7/KGWeave</a></small></p>
          </body></html>
          HTML

      - name: Deploy to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy demo (${{ github.sha }})"
