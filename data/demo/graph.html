ibutes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e105", "source": "soc_top.u_cpu.rst_ni", "target": "soc_top.u_cpu.u_alu.rst_ni", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e106", "source": "soc_top.u_cpu.rst_ni", "target": "soc_top.u_cpu.u_regfile.rst_ni", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e107", "source": "soc_top.u_cpu.data_addr_o", "target": "soc_top.cpu_addr", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e108", "source": "soc_top.u_cpu.data_we_o", "target": "soc_top.cpu_we", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e109", "source": "soc_top.u_cpu.data_wdata_o", "target": "soc_top.cpu_wdata", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e110", "source": "soc_top.u_cpu.u_alu", "target": "alu", "attributes": {"label": "instance_of", "color": "#16a085", "size": 1.5}}, {"key": "e111", "source": "soc_top.u_cpu.u_alu", "target": "soc_top.u_cpu", "attributes": {"label": "part_of", "color": "#f39c12", "size": 1.5}}, {"key": "e112", "source": "soc_top.u_cpu.reg_a", "target": "soc_top.u_cpu.u_alu.operand_a_i", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e113", "source": "soc_top.u_cpu.reg_b", "target": "soc_top.u_cpu.u_alu.operand_b_i", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e114", "source": "soc_top.u_cpu.u_alu.result_o", "target": "soc_top.u_cpu.alu_result", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e115", "source": "soc_top.u_cpu.alu_result", "target": "soc_top.u_cpu.u_regfile.wdata_i", "attributes": {"label": "connects_to", "color": "#e74c3c", "size": 1.5}}, {"key": "e116", "source": "soc_top.u_cpu.u_alu.zero_o", "target": "soc_top.u_cpu.alu_zero", "attributes": {"label": "connects_to", "color": "#e74c3c", "size":     // Build graph
    const graph = new graphology.Graph({multi: false, type: "directed"});
    graphData.nodes.forEach(n => {
      // ForceAtlas2 needs initial positions; without them every coord becomes NaN.
      const attrs = Object.assign({
        x: Math.random(),
        y: Math.random(),
      }, n.attributes);
      graph.addNode(n.key, attrs);
    });
    graphData.edges.forEach(e => {
      if (graph.hasNode(e.source) && graph.hasNode(e.target)) {
        try { graph.addEdge(e.source, e.target, e.attributes); } catch(err) {}
      }
    });

    // Layout — graphology-library@0.7 exposes layoutForceAtlas2 under graphologyLibrary
    const FA2 = graphologyLibrary.layoutForceAtlas2;
    const settings = FA2.inferSettings(graph);
    FA2.assign(graph, {settings, iterations: 200});

    // Render
    const container = document.getElementById("graph-container");
    const renderer = new Sigma(graph, container, {
      renderEdgeLabels: false,
      labelRenderedSizeThreshold: 8,
      defaultEdgeType: "arrow",
      defaultNodeType: "circle",
    });

    // Info
    document.getElementById("info").textContent =
      `${graph.order} nodes, ${graph.size} edges`;

    // Legend
    const legendEl = document.getElementById("legend");
    const types = graphData.legend.type_colors;
    Object.entries(types).forEach(([type, color]) => {
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${type}`;
      legendEl.appendChild(item);
    });

    // Search
    const searchInput = document.getElementById("search-input");
    searchInput.addEventListener("input", () => {
      const query = searchInput.value.toLowerCase();
      graph.forEachNode((node, attrs) => {
        const match = !query || attrs.label.toLowerCase().includes(query);
        graph.setNodeAttribute(node, "hidden", !match && query.length > 0);
      });
      renderer.refresh();
    });

    // Tooltip
    const tooltip = document.getElementById("tooltip");
    renderer.on("enterNode", ({node}) => {
      const attrs = graph.getNodeAttributes(node);
      tooltip.innerHTML = `<b>${attrs.label}</b><br>Type: ${attrs.entityType}<br>Mentions: ${attrs.mentions}<br>Sources: ${attrs.sources || "n/a"}`;
      tooltip.style.display = "block";
    });
    renderer.on("leaveNode", () => { tooltip.style.display = "none"; });
    renderer.getMouseCaptor().on("mousemove", (e) => {
      tooltip.style.left = e.x + 15 + "px";
      tooltip.style.top = e.y + 15 + "px";
    });
  </script>
