# @summary
# Golden Q&A set for the KGWeave eval harness, targeting the lowRISC Ibex
# RV32 core (https://github.com/lowRISC/ibex). 50 questions across five
# categories: structure (15), hierarchy (10), connectivity (10),
# parameters (10), architecture (5).
#
# *** DRAFT — needs human review against the Ibex source tree before
# this set can be considered authoritative. Entity names follow the
# KGWeave convention <module>.<port|signal|param>. ***
# @end-summary

questions:

  # ---------------------------------------------------------------------------
  # STRUCTURE (15) — what ports / signals / parameters does a module expose
  # ---------------------------------------------------------------------------

  - id: ibex-001
    question: What clock and reset ports does the ibex_core module expose?
    gold_entities: [ibex_core.clk_i, ibex_core.rst_ni]
    category: structure
    tags: [ports, clk_rst]

  - id: ibex-002
    question: Which ports form the instruction-fetch memory interface of ibex_core?
    gold_entities:
      - ibex_core.instr_req_o
      - ibex_core.instr_gnt_i
      - ibex_core.instr_rvalid_i
      - ibex_core.instr_addr_o
      - ibex_core.instr_rdata_i
    category: structure
    tags: [memory_interface, instruction_fetch]

  - id: ibex-003
    question: Which ports form the data (LSU) memory interface of ibex_core?
    gold_entities:
      - ibex_core.data_req_o
      - ibex_core.data_gnt_i
      - ibex_core.data_rvalid_i
      - ibex_core.data_we_o
      - ibex_core.data_be_o
      - ibex_core.data_addr_o
      - ibex_core.data_wdata_o
      - ibex_core.data_rdata_i
    category: structure
    tags: [memory_interface, lsu]

  - id: ibex-004
    question: What interrupt input ports does ibex_core have?
    gold_entities:
      - ibex_core.irq_software_i
      - ibex_core.irq_timer_i
      - ibex_core.irq_external_i
      - ibex_core.irq_fast_i
      - ibex_core.irq_nm_i
    category: structure
    tags: [interrupts]

  - id: ibex-005
    question: Which port indicates that ibex_core is currently busy?
    gold_entities: [ibex_core.core_busy_o]
    category: structure
    tags: [status]

  - id: ibex-006
    question: How is the boot address supplied to ibex_core?
    gold_entities: [ibex_core.boot_addr_i]
    category: structure
    tags: [reset, boot]

  - id: ibex-007
    question: How is the hart ID supplied to ibex_core?
    gold_entities: [ibex_core.hart_id_i]
    category: structure
    tags: [hart]

  - id: ibex-008
    question: What debug request port does ibex_core have?
    gold_entities: [ibex_core.debug_req_i]
    category: structure
    tags: [debug]

  - id: ibex-009
    question: What ports does the ibex_alu module expose for operands and result?
    gold_entities:
      - ibex_alu.operand_a_i
      - ibex_alu.operand_b_i
      - ibex_alu.result_o
      - ibex_alu.operator_i
    category: structure
    tags: [alu, datapath]

  - id: ibex-010
    question: What clock and reset ports does ibex_if_stage have?
    gold_entities: [ibex_if_stage.clk_i, ibex_if_stage.rst_ni]
    category: structure
    tags: [ports, if_stage]

  - id: ibex-011
    question: What read/write ports does ibex_register_file_ff expose for general-purpose registers?
    gold_entities:
      - ibex_register_file_ff.raddr_a_i
      - ibex_register_file_ff.rdata_a_o
      - ibex_register_file_ff.raddr_b_i
      - ibex_register_file_ff.rdata_b_o
      - ibex_register_file_ff.waddr_a_i
      - ibex_register_file_ff.wdata_a_i
      - ibex_register_file_ff.we_a_i
    category: structure
    tags: [regfile]

  - id: ibex-012
    question: Which ports does ibex_load_store_unit expose to the data memory bus?
    gold_entities:
      - ibex_load_store_unit.data_req_o
      - ibex_load_store_unit.data_gnt_i
      - ibex_load_store_unit.data_rvalid_i
      - ibex_load_store_unit.data_addr_o
      - ibex_load_store_unit.data_we_o
      - ibex_load_store_unit.data_be_o
      - ibex_load_store_unit.data_wdata_o
      - ibex_load_store_unit.data_rdata_i
    category: structure
    tags: [lsu, memory_interface]

  - id: ibex-013
    question: What ports does ibex_compressed_decoder expose?
    gold_entities:
      - ibex_compressed_decoder.instr_i
      - ibex_compressed_decoder.instr_o
      - ibex_compressed_decoder.is_compressed_o
      - ibex_compressed_decoder.illegal_instr_o
    category: structure
    tags: [decoder, compressed]

  - id: ibex-014
    question: What ports does ibex_controller use to signal pipeline-flush conditions?
    gold_entities:
