  instantiates: "instantiates"
  connects_to: "connects to"
  parameterized_by: "is parameterized by"
  belongs_to_clock_domain: "belongs to clock domain"
  clocked_by: "is clocked by"
  reset_by: "is reset by"
  implements_interface: "implements"
  transitions_to: "transitions to"
  has_fsm: "has FSM"
  has_state: "has state"
  drives: "drives"
  reads: "reads"
  drives_signal: "drives signal"
  data_flows: "data flows to"
  assigned_in: "is assigned in"
  specified_by: "is specified by"
  verified_by: "is verified by"
  authored_by: "was authored by"
  reviewed_by: "was reviewed by"
  blocks: "blocks"
  supersedes: "supersedes"
  constrained_by: "is constrained by"
  trades_off_against: "trades off against"
  assumes: "assumes"
  complies_with: "complies with"
  relates_to: "relates to"
  design_decision_for: "has design decision for"
  references: "references"
  realized_by: "is realized by"
  claims_about: "claims about"
  target_entity: "targets entity"
  enforced_by: "is enforced by"
  covered_by: "is covered by"
  measured_by: "is measured by"
  decomposes_into: "decomposes into"
  includes: "includes"
