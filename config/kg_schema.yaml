# Knowledge Graph Schema Definition
# Source of truth for entity types, edge types, and their properties.
# Used by: LLM extraction prompts, GLiNER label derivation, validation, parser mapping.
#
# Phase activation rules (REQ-KG-107):
#   phase_1   — active in Phase 1 (regex + GLiNER extractors)
#   phase_1b  — active in Phase 1b and later (requires SV parser)
#   phase_2   — active in Phase 2 and later (community detection, Neo4j)
#
# GLiNER label derivation (REQ-KG-108):
#   Use gliner_label when present; fall back to the type name otherwise.
#   All gliner_label values MUST be unique across node types.

version: "1.0"
description: "ASIC-focused knowledge graph schema for RagWeave"

# ---------------------------------------------------------------------------
# Node Types
# ---------------------------------------------------------------------------
node_types:

  structural:
    # -----------------------------------------------------------------------
    # Phase 1 baseline — detectable by regex and GLiNER extractors.
    # These 7 types cover the fundamental module hierarchy and are active
    # from the very first extraction pass.
    # -----------------------------------------------------------------------

    RTL_Module:
      description: "A hardware module definition (module...endmodule) in SystemVerilog"
      category: structural
      phase: phase_1
      extraction: parser  # deterministic parser extraction
      properties:
        - name
        - file_path
        - port_count
        - line_start
        - line_end
      possible_attributes:
        # reachable_from_top: tagged on the entity's aliases as
        # ``reachable=true|false`` after slang elaboration. Surfaces the
        # filelist-vs-elaboration gap (audit signal: alternates on disk
        # not wired into this build).
        - reachable_from_top
      gliner_label: "RTL module"
      extraction_hints: "Identified by `module <name>` declarations in SystemVerilog source files"

    Port:
      description: "An input, output, or inout port on a module"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - direction      # input | output | inout
        - width
        - type           # logic, wire, reg, etc.
        - parent_module
      gliner_label: "port"
      extraction_hints: "Declared in module port list or body (input, output, inout keywords)"

    Parameter:
      description: "A parameterizable value in a module (parameter, localparam)"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - default_value
        - type
        - parent_module
      gliner_label: "parameter"
      extraction_hints: "Declared with `parameter` or `localparam` keywords inside a module"

    Instance:
      description: "An instantiation of one module inside another"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - module_type    # name of the instantiated module
        - parent_module
        - line
      gliner_label: "instance"
      extraction_hints: "Module instantiation syntax: `<ModuleType> <instance_name> (...)` inside a parent module"

    Signal:
      description: "A wire, reg, or logic signal declaration"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - signal_type    # wire | reg | logic | etc.
        - width
        - parent_module
      gliner_label: "signal"
      extraction_hints: "Declared with wire, reg, or logic keywords inside a module body"

    Interface:
      description: "A SystemVerilog interface definition"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - file_path
        - port_count
      gliner_label: "interface"
      extraction_hints: "Defined with `interface <name>...endinterface` in SystemVerilog"

    Package:
      description: "A SystemVerilog package definition"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "package"
      extraction_hints: "Defined with `package <name>...endpackage` in SystemVerilog"

    # -----------------------------------------------------------------------
    # Phase 1b specialized — require SV parser (tree-sitter-verilog) for
    # reliable extraction. Activated when runtime phase >= phase_1b.
    # -----------------------------------------------------------------------

    ClockDomain:
      description: "A clock domain grouping signals and logic driven by the same clock"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - clock_signal
        - frequency_mhz
      gliner_label: "clock domain"
      extraction_hints: "Identified from clock signal declarations and always blocks sensitive to a clock edge"

    ResetDomain:
      description: "A reset domain grouping signals and logic driven by the same reset"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - reset_signal
        - active_level   # active_low | active_high
      gliner_label: "reset domain"
      extraction_hints: "Identified from reset signals appearing in always_ff sensitivity lists (posedge/negedge rst*)"

    TypeDef:
      description: "A typedef or enum type definition in SystemVerilog"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - base_type
        - parent_package
      gliner_label: "typedef"
      extraction_hints: "Declared with `typedef` keyword; enum types use `typedef enum`"

    FSM_State:
      description: "A state in a finite state machine"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - fsm_name
        - parent_module
      gliner_label: "FSM"  # short natural-language label preferred by GLiNER
      extraction_hints: "Identified by enum state declarations or case statements inside always blocks; look for state register patterns"

    FSM:
      description: "A finite state machine identified by an enum-typed state register variable"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_module
        - state_register   # name of the registered state variable (e.g. cs, state_q)
      gliner_label: "finite state machine"
      extraction_hints: "Identified by an enum-typed Variable in a module body; the registered (NBA-driven) instance is treated as the FSM. Named '<module>.<var>'"

    Generate:
      description: "A generate block (generate...endgenerate) using for, if, or case"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - generate_type  # for | if | case
        - parent_module
      gliner_label: "generate block"
      extraction_hints: "Enclosed in `generate...endgenerate` blocks with genvar loop variables or conditional logic"

    Process:
      description: "A SystemVerilog procedural process (always_* block) or continuous-assign group emitting drives within a module."
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - process_kind   # always_ff | always_comb | always_latch | always | assign
        - parent_module
      gliner_label: "process block"
      extraction_hints: "Identified by always_ff/always_comb/always_latch/always blocks and continuous-assign groups inside a module body"

    Task_Function:
      description: "A task or function definition in SystemVerilog"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - kind           # task | function
        - return_type
        - parent_module
      gliner_label: "task or function"
      extraction_hints: "Declared with `task <name>...endtask` or `function <name>...endfunction`"

    SVA_Assertion:
      description: "A SystemVerilog assertion (assert, assume, cover property)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - assertion_type  # assert | assume | cover
        - property_expr
        - parent_module
      gliner_label: "SVA assertion"
      extraction_hints: "Uses assert property, assume property, or cover property syntax; may be named with a label"

    UVM_Component:
      description: "A UVM component class (uvm_test, uvm_env, uvm_agent, uvm_driver, etc.)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - uvm_base_class  # uvm_test | uvm_env | uvm_agent | etc.
        - file_path
      gliner_label: "UVM component"
      extraction_hints: "Classes that extend uvm_* base classes; look for `extends uvm_test`, `extends uvm_env`, etc."

    TestCase:
      description: "A verification test case or test program"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - file_path
        - test_type       # directed | constrained-random | formal
      gliner_label: "test case"
      extraction_hints: "Test programs or UVM test classes that exercise a design under test"

    CoverGroup:
      description: "A SystemVerilog coverage group definition (covergroup...endgroup)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_module
        - coverpoints
      gliner_label: "covergroup"
      extraction_hints: "Defined with `covergroup <name>...endgroup`; contains coverpoints and cross coverage"

    Sequence:
      description: "A sequence definition for SystemVerilog assertions or UVM sequences"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - kind            # sv_sequence | uvm_sequence
        - parent_module
      gliner_label: "sequence"
      extraction_hints: "SVA sequences defined with `sequence <name>...endsequence`; UVM sequences extend uvm_sequence"

    Constraint:
      description: "A constraint block in a randomizable class"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_class
      gliner_label: "constraint"
      extraction_hints: "Declared with `constraint <name> { ... }` inside a class that extends uvm_object or similar"

    Pipeline_Stage:
      description: "A pipeline stage in a datapath or arithmetic design"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - stage_index
        - parent_module
      gliner_label: "pipeline stage"
      extraction_hints: "Registers between combinational logic stages; often identified by naming conventions (e.g., _stage1_, _pipe_)"

    FIFO_Buffer:
      description: "A FIFO or buffer component used for flow control or data buffering"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - depth
        - width
        - parent_module
      gliner_label: "FIFO"
      extraction_hints: "Modules named with fifo, buffer, or queue; typically have rd/wr pointers and full/empty flags"

    Arbiter:
      description: "An arbitration component that selects among multiple requestors"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - arbitration_scheme  # round-robin | fixed-priority | weighted
        - num_requestors
        - parent_module
      gliner_label: "arbiter"
      extraction_hints: "Modules named with arb or arbiter; implement grant/request handshake logic"

    Decoder_Encoder:
      description: "A decoder or encoder component for signal demultiplexing or encoding"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - kind            # decoder | encoder | priority_encoder
        - input_width
        - output_width
        - parent_module
      gliner_label: "decoder or encoder"
      extraction_hints: "Modules or combinational blocks named with dec, decoder, enc, or encoder"

    RegisterFile:
      description: "A register file or register bank containing addressable registers"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - num_registers
        - data_width
        - addr_width
        - parent_module
      gliner_label: "register file"
      extraction_hints: "Arrays of registers addressable by an index or address; often named regfile, rf, or reg_bank"

    MemoryMap:
      description: "A memory map or address map defining address regions and register offsets"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - base_address
        - size
        - file_path
      gliner_label: "memory map"
      extraction_hints: "Address maps in SystemVerilog UVM RAL, spreadsheets, or header files defining BASE_ADDR and offset constants"

    Testpoint:
      description: "A DV testplan testpoint (one milestone in a verification plan)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - desc
        - stage
        - tags
      gliner_label: "testpoint"
      extraction_hints: "Entries under testpoints[] in an OpenTitan-style *_testplan.hjson file"

    Covergroup:
      description: "A DV-plan covergroup declaration (functional coverage bucket)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - desc
      gliner_label: "DV plan covergroup"
      extraction_hints: "Entries under covergroups[] in an OpenTitan-style *_testplan.hjson file"

    # NOTE: ``Covergroup_SV`` (below) is the *SystemVerilog* covergroup
    # extracted by the slang elaborator from RTL/DV source — i.e. the actual
    # ``covergroup ... endgroup`` block that runs at simulation time. It is
    # intentionally distinct from the existing ``Covergroup`` testplan-side
    # node (a DV plan declaration parsed from ``*_testplan.hjson``). The two
    # represent the same audit concept from different sources, kept apart
    # so the audit query can join "plan covergroup" -> "actual SV covergroup".

    Covergroup_SV:
      description: "A SystemVerilog covergroup definition extracted from RTL/DV source via slang elaboration"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_module
      gliner_label: "SV covergroup"
      extraction_hints: "Defined with `covergroup <name> ... endgroup`; surfaced from the elaborated symbol tree (SymbolKind.CovergroupType)"

    Coverpoint:
      description: "A coverpoint inside a SystemVerilog covergroup; observes one signal/expression"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_covergroup
      gliner_label: "coverpoint"
      extraction_hints: "Inner `[label:] coverpoint <expr> { bins ... }` clauses inside a covergroup body"

    CoverBin:
      description: "A bin (or transition bin) inside a coverpoint"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_coverpoint
      gliner_label: "cover bin"
      extraction_hints: "`bins <name> = { ... };` entries inside a coverpoint body"

    CoverCross:
      description: "A cross between two or more coverpoints inside a covergroup"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_covergroup
      gliner_label: "cover cross"
      extraction_hints: "`[label:] cross cp_a, cp_b;` clauses inside a covergroup body"

    Covergroup_SampleArg:
      description: "A formal argument of a SystemVerilog covergroup's `with function sample(...)` subroutine; coverpoints that sample this argument emit an `observes` edge here"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_covergroup
      gliner_label: "covergroup sample arg"
      extraction_hints: "Synthesised from `with function sample(<type> <arg>, ...)` on a covergroup declaration; named `{module}.{cg_name}.arg.{arg_name}`"
      subtype_of: HW_Component

    Stage:
      description: "A DV verification lifecycle stage (e.g. V1, V2, V2S, V3)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
      gliner_label: "verification stage"
      extraction_hints: "OpenTitan DV milestone tags V1/V2/V2S/V3 referenced from testpoint stage fields"

    DVTest:
      description: "A DV test name referenced from a testplan testpoint"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
      gliner_label: "DV test"
      extraction_hints: "Strings inside the tests[] list of a testpoint entry; not yet fused to a SystemVerilog UVM test class"

    SV_File:
      description: "A SystemVerilog source file in the dv/tests directory (test implementation)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "SV test file"
      extraction_hints: "SystemVerilog files in dv/tests/ matched to DVTest entities by filename heuristics"

    CFile:
      description: "A C or C++ source file (.c/.cc/.cpp/.h/.hh/.hpp) ingested as a reference model or DPI boundary implementation"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "C source file"
      extraction_hints: "C/C++ files in hw/ip/*/model/ or dv/*/dpi/ directories; emitted by CppRefModelExtractor"

    CFunction:
      description: "A top-level C/C++ function definition extracted by heuristic regex (no libclang)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_file
      gliner_label: "C function"
      extraction_hints: "Function definitions matching ^<return_type> <name>(...) { in C/C++ source; emitted by CppRefModelExtractor"

    DPIBoundary:
      description: "A SystemVerilog DPI-C imported function declaration (import \"DPI-C\" function)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
      gliner_label: "DPI-C boundary"
      extraction_hints: "import \"DPI-C\" function/task declarations in SV packages or modules; emitted by extract_dpi_boundaries()"

    SW_Test:
      description: "A bare-metal C regression test that exercises an IP through CSR mmio"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "SW test"
      extraction_hints: "*.c files in sw/device/tests/ that reference mmio primitives or DIF layer calls; emitted by SWTestExtractor"

    UVMSampleCallsite:
      description: "A single SystemVerilog .sample() callsite at a (file, line, col) location — closes the audit chain from RTL_Module via Covergroup_SV down to actual testbench invocations"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - file_path
        - line
        - column
      gliner_label: "UVM sample callsite"
      extraction_hints: "Synthesised from `<inst>.<wrapper>(...)` or `<cg>_inst.sample(...)` invocations in dv/env/ and dv/cov/; emitted by UVMSampleExtractor (parser-only walk, no UVM elaboration)"
      subtype_of: HW_Component

    UVMSampleWrapper:
      description: "A wrapper function/task (typically `cg_X_sample`) defined inside an interface that forwards arguments to a covergroup's `<cg>_inst.sample(...)`"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_file
        - param_count
      gliner_label: "UVM sample wrapper"
      extraction_hints: "Function/task whose body invokes `<cg>_inst.sample(...)`; conventionally named `cg_<name>_sample`; emitted by UVMSampleExtractor"
      subtype_of: HW_Component

    UVMSampleArgExpr:
      description: "The textual expression passed at a positional argument of a UVMSampleCallsite — the audit handle that links a wrapper formal arg back to a Covergroup_SampleArg"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - parent_callsite
        - index
      gliner_label: "UVM sample arg expression"
      extraction_hints: "One per ordered argument of a sample-callsite invocation; named `{callsite_name}.arg{idx}`; emitted by UVMSampleExtractor"
      subtype_of: HW_Component

  semantic:
    # -----------------------------------------------------------------------
    # All semantic types are Phase 1 — extractable by LLM/NER from prose
    # documents (specs, design notes, review comments, etc.).
    # -----------------------------------------------------------------------

    Specification:
      description: "A formal specification or requirements document (e.g., design spec, databook)"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - version
        - status         # draft | approved | deprecated
        - file_path
      gliner_label: "specification"
      extraction_hints: "Documents titled with spec, specification, databook, or TRM; often versioned with revision numbers"

    DesignDecision:
      description: "A documented design choice or architectural decision and its rationale"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - rationale
        - alternatives_considered
        - decision_date
      gliner_label: "design decision"
      extraction_hints: "Statements of the form 'we decided to...', 'chosen approach is...', or ADR-style records"

    Requirement:
      description: "A functional or non-functional requirement that the design must satisfy"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - requirement_id  # e.g., REQ-001
        - priority        # MUST | SHOULD | MAY
        - status          # open | met | deferred
      gliner_label: "requirement"
      extraction_hints: "Statements using MUST, SHALL, SHOULD, or requirement ID labels like REQ-XXX"

    TradeOff:
      description: "A documented trade-off between competing design goals or quality attributes"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - dimension_a     # e.g., area
        - dimension_b     # e.g., speed
        - resolution
      gliner_label: "trade-off"
      extraction_hints: "Statements discussing compromises between area/speed/power, latency/throughput, or cost/performance"

    KnownIssue:
      description: "A documented known issue, bug, limitation, or errata"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - issue_id
        - severity        # critical | major | minor
        - workaround
        - status          # open | resolved
      gliner_label: "known issue"
      extraction_hints: "Sections titled errata, known issues, or limitations; bug tracker references"

    Assumption:
      description: "A documented assumption underlying a design or decision"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - rationale
        - owner
      gliner_label: "assumption"
      extraction_hints: "Statements beginning with 'we assume', 'it is assumed', or 'assuming that'"

    Person:
      description: "An individual (engineer, designer, reviewer, or author)"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - role            # designer | reviewer | PM | etc.
        - email
      gliner_label: "person"
      extraction_hints: "Named individuals in author, reviewer, or contact fields; signatures in documents"

    Team:
      description: "A team or organizational unit responsible for part of the design"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - department
        - contact
      gliner_label: "team"
      extraction_hints: "Org unit names in ownership, escalation, or contact sections of documents"

    Project:
      description: "A project or program that encompasses a set of design deliverables"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - status          # planning | active | completed | cancelled
        - tapeout_target
      gliner_label: "project"
      extraction_hints: "Project names, program names, or chip names referenced in document headers or scope sections"

    Review:
      description: "A design review, code review, or sign-off event"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - review_type     # design-review | code-review | sign-off
        - date
        - outcome         # approved | approved-with-action-items | rejected
      gliner_label: "review"
      extraction_hints: "Design review meetings, code review records, milestone sign-offs; look for date + reviewer + outcome"

    Protocol:
      description: "A communication protocol or bus standard (AXI, APB, SPI, I2C, PCIe, etc.)"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - version         # e.g., AXI4, PCIe Gen4
        - standard_body   # AMBA, IEEE, etc.
      gliner_label: "protocol"
      extraction_hints: "Named bus or communication protocols; common examples include AXI, AHB, APB, SPI, I2C, PCIe, USB, DDR"

    IP_Block:
      description: "A reusable IP block or hard macro integrated into the design"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - vendor
        - version
        - license_type    # open | commercial | internal
      gliner_label: "IP block"
      extraction_hints: "Referenced as third-party IP, purchased macro, or reused block from a library; often named with vendor prefix"

    EDA_Tool:
      description: "An EDA tool used in the design flow (Synopsys DC, Cadence Innovus, etc.)"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - vendor          # Synopsys | Cadence | Mentor | Siemens | etc.
        - version
        - flow_stage      # synthesis | place-and-route | simulation | formal | etc.
      gliner_label: "EDA tool"
      extraction_hints: "Tool names such as Design Compiler, Genus, Innovus, VCS, ModelSim, Questasim, Jasper, Formality"

    Script:
      description: "An automation script used in the design or verification flow (TCL, Python, shell)"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - language        # tcl | python | bash | perl | makefile
        - file_path
        - purpose
      gliner_label: "script"
      extraction_hints: "Referenced automation scripts, run scripts, or makefiles; file extensions .tcl, .py, .sh, .pl"

    TimingConstraint:
      description: "A timing constraint specifying clock period, setup/hold margins, or multicycle paths"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - constraint_type  # clock | setup | hold | multicycle | false-path
        - value
        - unit             # ns | ps | MHz
      gliner_label: "timing constraint"
      extraction_hints: "SDC commands like create_clock, set_input_delay, set_multicycle_path; or prose references to timing targets"

    AreaConstraint:
      description: "An area constraint or die/block utilization target"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - target_value
        - unit             # um2 | gates | cells | %
        - block
      gliner_label: "area constraint"
      extraction_hints: "References to area budget, utilization target, cell count limit, or die size constraint"

    PowerConstraint:
      description: "A power constraint or power domain definition with leakage/dynamic targets"
      category: semantic
      phase: phase_1
      extraction: llm
      properties:
        - name
        - power_domain
        - target_value
        - unit             # mW | uW
        - power_type       # dynamic | leakage | total
      gliner_label: "power constraint"
      extraction_hints: "References to power budget, UPF/CPF power domain definitions, or power targets in specifications"


    # -----------------------------------------------------------------------
    # Phase 2 parser types — Python and Bash structural extraction.
    # Activated when runtime phase >= phase_2.
    # -----------------------------------------------------------------------

    PythonClass:
      description: "A Python class definition"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
        - base_classes
      gliner_label: "python class"
      extraction_hints: "Identified by `class <name>:` declarations in Python source files"

    PythonFunction:
      description: "A Python function or method definition"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
        - parent_class
      gliner_label: "python function"
      extraction_hints: "Identified by `def <name>` or `async def <name>` declarations"

    PythonImport:
      description: "A Python import dependency"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "python import"
      extraction_hints: "Identified by `import` or `from ... import` statements"

    PythonVariable:
      description: "A Python module-level constant (ALL_CAPS assignment)"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "python constant"
      extraction_hints: "Module-level ALL_CAPS variable assignments"

    BashFunction:
      description: "A Bash/Shell function definition"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "bash function"
      extraction_hints: "Identified by `function <name>()` or `<name>() {` patterns"

    BashScript:
      description: "A sourced Bash/Shell script dependency"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "bash script"
      extraction_hints: "Identified by `source <file>` or `. <file>` statements"

    BashVariable:
      description: "An exported or readonly Bash/Shell variable"
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - name
        - file_path
      gliner_label: "bash variable"
      extraction_hints: "Identified by `export VAR=` or `readonly VAR=` patterns"

    Section:
      description: "A markdown documentation section identified by an h1/h2/h3 header"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - file_path
        - header_level
      gliner_label: "documentation section"
      extraction_hints: "Headers in markdown documentation; named '<doc_basename>#<slug>'"

    CSR_Register:
      description: "A control/status register defined in an OpenTitan-style HJSON register description"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - parent_module
        - swaccess
        - hwaccess
        - offset
      gliner_label: "CSR register"
      extraction_hints: "Entries inside the registers[] list of an HJSON register description; named '<MODULE>.<REG>'"

    CSR_Field:
      description: "A bit-field within a CSR register"
      category: structural
      phase: phase_1
      extraction: parser
      properties:
        - name
        - parent_register
        - bits
        - swaccess
        - resval
      gliner_label: "CSR field"
      extraction_hints: "Entries inside the fields[] list of a register; named '<MODULE>.<REG>.<FIELD>'"

    ClockConstraint:
      description: "An SDC create_clock or create_generated_clock constraint anchored to a ClockDomain"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - period
        - generated
        - source
      gliner_label: "clock constraint"
      extraction_hints: "Emitted by SDCExtractor from create_clock / create_generated_clock; named '<sdc_basename>.create_clock.<clock_name>'"

    IODelay:
      description: "An SDC set_input_delay or set_output_delay constraint anchored to a Port and ClockDomain"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - direction
        - delay
        - clock
      gliner_label: "I/O delay"
      extraction_hints: "Emitted by SDCExtractor from set_input_delay / set_output_delay; named '<sdc_basename>.<dir>_delay.<port>'"

    FalsePath:
      description: "An SDC set_false_path exception with from/to endpoints"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
      gliner_label: "false path"
      extraction_hints: "Emitted by SDCExtractor from set_false_path; named '<sdc_basename>.false_path.<idx>'"

    MulticyclePath:
      description: "An SDC set_multicycle_path exception with cycle count and from/to endpoints"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - cycles
        - kind
      gliner_label: "multicycle path"
      extraction_hints: "Emitted by SDCExtractor from set_multicycle_path; named '<sdc_basename>.multicycle_path.<idx>'"

    ClockGroup:
      description: "An SDC set_clock_groups declaration grouping ClockDomains as async/exclusive"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - kind
      gliner_label: "clock group"
      extraction_hints: "Emitted by SDCExtractor from set_clock_groups; named '<sdc_basename>.clock_group.<idx>'"

    # -----------------------------------------------------------------------
    # IP-XACT 1685-2014 declarative wrappers — emitted by IPXACTExtractor.
    # Each IPXACT_X is the "intent" side that the canonical X (Port /
    # ClockDomain / CSR_Register / etc.) is expected to implement. The
    # cross-source completeness audit query enumerates IPXACT_X entities
    # and looks for a `specifies` edge to a known canonical entity; missing
    # edges signal a gap (RTL doesn't implement what IP-XACT declares).
    # -----------------------------------------------------------------------

    IPXACT_Component:
      description: "An IP-XACT component declaration (top-level <component> element)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
        - vendor
        - library
        - version
      gliner_label: "IP-XACT component"
      extraction_hints: "Emitted by IPXACTExtractor from <component>; named after the component's <name>"

    IPXACT_Port:
      description: "An IP-XACT <port> declaration with direction and optional vector width"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - direction
        - vector_width
      gliner_label: "IP-XACT port"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_port.<port>'"

    IPXACT_Clock:
      description: "An IP-XACT clock-qualified port (isClock qualifier set)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - direction
      gliner_label: "IP-XACT clock"
      extraction_hints: "Emitted by IPXACTExtractor for ports with <qualifier><isClock>true; named '<component>.ipxact_clock.<port>'"

    IPXACT_Reset:
      description: "An IP-XACT reset-qualified port (isReset qualifier set)"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - direction
      gliner_label: "IP-XACT reset"
      extraction_hints: "Emitted by IPXACTExtractor for ports with <qualifier><isReset>true; named '<component>.ipxact_reset.<port>'"

    IPXACT_Register:
      description: "An IP-XACT <register> declaration in a memoryMap/addressBlock"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - address_offset
        - size
      gliner_label: "IP-XACT register"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_register.<reg>'"

    IPXACT_Field:
      description: "An IP-XACT <field> declaration inside a <register>"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - bit_offset
        - bit_width
        - access
      gliner_label: "IP-XACT field"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_register.<reg>.<field>'"

    IPXACT_BusInterface:
      description: "An IP-XACT <busInterface> declaration"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - kind
      gliner_label: "IP-XACT bus interface"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_busif.<name>'"

    IPXACT_AddressBlock:
      description: "An IP-XACT <addressBlock> with base address, range and width"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - base_address
        - range
        - width
      gliner_label: "IP-XACT address block"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_addrblock.<name>'"

    IPXACT_FieldEnum:
      description: "An IP-XACT <enumeratedValue> inside a register field"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - value
        - usage
      gliner_label: "IP-XACT field enum"
      extraction_hints: "Emitted by IPXACTExtractor for <enumeratedValue>; named '<component>.ipxact_register.<reg>.<field>.<enum>'"

    IPXACT_Parameter:
      description: "An IP-XACT component-scope <parameter> or <moduleParameter>"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - value
        - data_type
      gliner_label: "IP-XACT parameter"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_param.<name>'"

    IPXACT_FileSet:
      description: "An IP-XACT <fileSet> bundling RTL source files for the component"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - files
      gliner_label: "IP-XACT file set"
      extraction_hints: "Emitted by IPXACTExtractor; named '<component>.ipxact_fileset.<name>'"

    IPXACT_BusType:
      description: "An IP-XACT bus protocol reference (vendor::library::name::version) shared across busInterfaces that conform to it"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - vendor
        - library
        - name
        - version
      gliner_label: "IP-XACT bus type"
      extraction_hints: "Emitted by IPXACTExtractor for <busType vendor=… library=… name=… version=…/>; deduplicated and named '<vendor>::<library>::<name>::<version>'"

    IPXACT_LogicalPort:
      description: "An IP-XACT <logicalPort> declared inside a <portMap> — the protocol-side name (e.g. a_valid) the physical RTL port realises"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - direction
      gliner_label: "IP-XACT logical port"
      extraction_hints: "Emitted by IPXACTExtractor for portMap/logicalPort; named '<component>.ipxact_busif.<bif>.logical.<logical_name>'"

    IPXACT_MemoryMap:
      description: "An IP-XACT <memoryMap> grouping address blocks; the slave-side memoryMapRef target"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - name
      gliner_label: "IP-XACT memory map"
      extraction_hints: "Emitted by IPXACTExtractor for <memoryMap>; named '<component>.ipxact_memmap.<name>'"

    IPXACT_AddressSpace:
      description: "An IP-XACT <addressSpace> declared at component scope; the master-side addressSpaceRef target"
      category: structural
      phase: phase_1b
      extraction: parser
      properties:
        - range
        - width
      gliner_label: "IP-XACT address space"
      extraction_hints: "Emitted by IPXACTExtractor for <addressSpace>; named '<component>.ipxact_addrspace.<name>'"

  claim:
    # -----------------------------------------------------------------------
    # Phase-1c spec-claim layer — emitted by SpecClaimExtractor (LLM driven).
    # Each claim is a first-class node so the killer audit query can ask
    # "for every spec claim, is there a testpoint / SVA / coverpoint?".
    # -----------------------------------------------------------------------

    StructuralClaim:
      description: "A static structural claim from the spec (e.g. 'AES has a 128-bit data path')"
      category: claim
      phase: phase_1
      extraction: llm
      properties:
        - target
        - attribute
        - value
        - verification_strength
        - evidence_span
      gliner_label: "structural claim"
      extraction_hints: "Emitted by SpecClaimExtractor for prose sentences asserting static structural facts about the design"

    BehavioralClaim:
      description: "A runtime / latency / sequencing claim (e.g. 'the cipher completes in 14 cycles')"
      category: claim
      phase: phase_1
      extraction: llm
      properties:
        - target
        - behavior
        - constraint_type
        - value
        - verification_strength
        - evidence_span
      gliner_label: "behavioral claim"
      extraction_hints: "Emitted by SpecClaimExtractor for prose sentences asserting timing, latency, throughput, or sequencing behavior"

    ProtocolClaim:
      description: "A signal-level / interface protocol claim (e.g. 'data_in is sampled on rising edge of clk_i')"
      category: claim
      phase: phase_1
      extraction: llm
      properties:
        - target
        - signal
        - condition
        - verification_strength
        - evidence_span
      gliner_label: "protocol claim"
      extraction_hints: "Emitted by SpecClaimExtractor for prose describing handshake / sampling / sequencing of named signals"

    SecurityClaim:
      description: "A security property or threat-model claim (e.g. 'the implementation is constant-time')"
      category: claim
      phase: phase_1
      extraction: llm
      properties:
        - target
        - property
        - threat_model
        - verification_strength
        - evidence_span
      gliner_label: "security claim"
      extraction_hints: "Emitted by SpecClaimExtractor for prose making security guarantees or naming threat models"

  # -------------------------------------------------------------------------
  # v2 AST decomposition layer (phase_2, layer="ast")
  # See docs/v2_dataflow_schema.md. All entities of these types are emitted
  # with layer="ast" and are hidden from default consumer views. Internal
  # node IDs follow `<module>.<process_kind>_<idx>.<path_hash>...`.
  # -------------------------------------------------------------------------
  ast:
    Operator:
      description: "An elaborated operator expression (binary/unary/ternary). Emitted at layer='ast' with attributes['kind'] = 'Add' | 'LogicalAnd' | 'Conditional' | ..."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - kind
        - text
      gliner_label: "operator expression"
      extraction_hints: "Emitted by V2DataflowWalker / V2IntegrationDriver for every elaborated operator inside a Process body"

    Literal:
      description: "A constant-valued expression node (numeric/string/parameter-resolved). Shared by value within a module."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - text
      gliner_label: "literal expression"
      extraction_hints: "Emitted by V2DataflowWalker; one entity per distinct literal text within a module"

    Index:
      description: "A bit-select / part-select node (signal[i] or signal[hi:lo]). Connects to its base signal via slice_of."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - text
        - source_text
      gliner_label: "bit-slice index"
      extraction_hints: "Emitted by V2DataflowWalker for IdentifierSelectName expressions"

    Condition:
      description: "A boolean expression at a control-flow gate (if/case/?:/loop bound). Carries source-text in attributes['text']; bridged to track-A Operator roots via 'operand'."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - text
      gliner_label: "control-flow condition"
      extraction_hints: "Emitted by SVStatementDecomposer; bridged to its Operator root by V2IntegrationDriver"

    IfStatement:
      description: "An elaborated if/elif/else chain (container holding ordered Branch nodes via then_branch/elif_branch/else_branch)."
      category: structural
      phase: phase_2
      extraction: parser
      gliner_label: "if statement"
      extraction_hints: "Emitted by SVStatementDecomposer for ConditionalStatement chains"

    CaseStatement:
      description: "An elaborated case / casex / casez / unique case (container holding ordered Branch case-items + an optional default_branch)."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - case_kind
      gliner_label: "case statement"
      extraction_hints: "Emitted by SVStatementDecomposer for CaseStatement nodes"

    Loop:
      description: "An elaborated for / while / repeat / forever / foreach loop. Body is wired via body_of."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - loop_kind
      gliner_label: "loop statement"
      extraction_hints: "Emitted by SVStatementDecomposer for ForLoopStatement / LoopStatement / ForeverStatement / ForeachLoopStatement"

    Branch:
      description: "A specific arm of an if / case / ternary. Carries an ordered branch_path list of ancestor branches."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - branch_path
      gliner_label: "control-flow branch"
      extraction_hints: "Emitted by SVStatementDecomposer for each arm of an IfStatement or CaseStatement"

    Assignment:
      description: "A single = / <= / assign site. lhs / rhs predicates connect it to its expression-node operands."
      category: structural
      phase: phase_2
      extraction: parser
      properties:
        - assign_kind   # blocking | nonblocking | continuous
        - branch_path
      gliner_label: "assignment site"
      extraction_hints: "Emitted by SVStatementDecomposer for AssignmentExpression / NonblockingAssignmentExpression"

# ---------------------------------------------------------------------------
# Edge Types
# ---------------------------------------------------------------------------
edge_types:

  structural:
    # -----------------------------------------------------------------------
    # Phase 1 structural edges — active with basic regex/GLiNER extractors.
    # -----------------------------------------------------------------------

    depends_on:
      description: "Component A depends on component B (generic dependency)"
      category: structural
      phase: phase_1
      extraction: parser  # also regex
      source_types: [RTL_Module, Instance, Package, Interface]
      target_types: [RTL_Module, Package, Interface, IP_Block]

    contains:
      description: "Parent entity contains child entity (hierarchical membership)"
      category: structural
      phase: phase_1
      extraction: parser
      source_types: [RTL_Module, Package, Interface, RegisterFile, MemoryMap]
      target_types:
        - Port
        - Parameter
        - Signal
        - Instance
        - TypeDef
        - Task_Function
        - SVA_Assertion
        - CoverGroup
        - Sequence
        - Constraint
        - Generate
        - RegisterFile

    # -----------------------------------------------------------------------
    # Phase 1b structural edges — require SV parser for deterministic extraction.
    # -----------------------------------------------------------------------

    instantiates:
      description: "Module A instantiates module B (hierarchical instantiation)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module, Instance]
      target_types: [RTL_Module, IP_Block]

    connects_to:
      description: "Signal or port A connects to signal or port B across a module boundary"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Port, Signal]
      target_types: [Port, Signal, Instance]

    # ------------------------------------------------------------------
    # V2 unified dataflow predicate (Wave 2 / track E).
    # `data_flows` collapses v1's split between `drives_signal` (intra-
    # module) and `connects_to` / `drives` (port-instance binding) into a
    # single edge so a BFS traces a signal across module boundaries in
    # one query. Edge attribute `flow_kind` partitions the unified edge
    # back into its three logical kinds:
    #   * "intra"     — RHS → LHS within a single module
    #   * "port_in"   — parent net → child input port (cross-module)
    #   * "port_out"  — child output port → parent net (cross-module)
    # All `data_flows` triples are tagged ``layer="slang"`` per
    # docs/v2_dataflow_schema.md § "Layering".
    # During the migration window, legacy `drives_signal` and `drives`
    # edges remain dual-emitted alongside `data_flows`.
    # ------------------------------------------------------------------
    data_flows:
      description: "V2 unified dataflow hop. Subsumes intra-module RHS->LHS dataflow (flow_kind=intra) and cross-module port-instance bindings (flow_kind=port_in / port_out). BFS over data_flows traces a signal across module boundaries seamlessly."
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Signal, Port]
      target_types: [Signal, Port]

    parameterized_by:
      description: "Module or instance is parameterized by a parameter value"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module, Instance]
      target_types: [Parameter]

    belongs_to_clock_domain:
      description: "Signal or module belongs to a specific clock domain"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Signal, RTL_Module, Port]
      target_types: [ClockDomain]

    clocked_by:
      description: "RTL module is clocked by a clock domain (derived from always_ff sensitivity lists)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module]
      target_types: [ClockDomain]

    reset_by:
      description: "RTL module is reset by a reset domain (derived from always_ff sensitivity lists)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module]
      target_types: [ResetDomain]

    has_assertion:
      description: "RTL module owns a SystemVerilog assertion (assert/assume/cover/restrict property)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module]
      target_types: [SVA_Assertion]

    bound_into:
      description: "SystemVerilog `bind` directive — the bound module/interface (assertion checker, covergroup wrapper, etc.) is injected into the target module's hierarchy"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module, Interface]
      target_types: [RTL_Module, Interface]

    references_signal:
      description: "Assertion (or other expression-bearing entity) references a port/signal/clock"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [SVA_Assertion]
      target_types: [Port, Signal, ClockDomain]

    implements_interface:
      description: "Module implements or binds to a SystemVerilog interface"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module]
      target_types: [Interface]

    transitions_to:
      description: "FSM state A transitions to state B"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [FSM_State]
      target_types: [FSM_State]

    has_fsm:
      description: "RTL module owns a finite state machine (one per enum-typed state register)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module]
      target_types: [FSM]

    has_state:
      description: "FSM has the given FSM_State as one of its possible states"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [FSM]
      target_types: [FSM_State]

    drives:
      description: "Signal or port drives (writes to) another signal or port"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Signal, Port]
      target_types: [Signal, Port]

    reads:
      description: "Intra-module signal-level dataflow: LHS signal/port reads from RHS signal/port (RHS appears in the assignment expression that writes LHS). Distinct from cross-module 'drives' which models port-to-net connectivity."
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Signal, Port, RTL_Module, Task_Function]
      target_types: [Signal, Port, RegisterFile]

    drives_signal:
      description: "Intra-module forward dataflow: a RHS source signal/port drives an LHS target signal/port (whole-signal granularity). Emitted from continuous-assign and always_* block LHS targets within a single module."
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Signal, Port]
      target_types: [Signal, Port]

    assigned_in:
      description: "Anchors a target signal/port to the Process node (always_* block or continuous-assign group) that writes it inside a module."
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Signal, Port]
      target_types: [Process]

    references:
      description: "Documentation section references another section or doc anchor"
      category: structural
      phase: phase_1
      extraction: parser
      source_types: [Section]
      target_types: [Section]

    mentions:
      description: "Documentation section mentions an RTL entity (anchors prose to design)"
      category: structural
      phase: phase_1
      extraction: parser
      source_types: [Section]
      target_types: [RTL_Module, Instance, Port]

    has_register:
      description: "RTL module exposes a CSR register in its register description"
      category: structural
      phase: phase_1
      extraction: parser
      source_types: [RTL_Module]
      target_types: [CSR_Register]

    has_field:
      description: "CSR register contains a bit-field"
      category: structural
      phase: phase_1
      extraction: parser
      source_types: [CSR_Register]
      target_types: [CSR_Field]

    constrains_clock:
      description: "SDC ClockConstraint anchors to the ClockDomain it constrains"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [ClockConstraint]
      target_types: [ClockDomain]

    constrains_port:
      description: "SDC IODelay anchors to the Port it constrains"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IODelay]
      target_types: [Port]

    relative_to_clock:
      description: "SDC IODelay or generated ClockConstraint references its reference ClockDomain"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IODelay, ClockConstraint, MulticyclePath]
      target_types: [ClockDomain]

    from_endpoint:
      description: "SDC FalsePath / MulticyclePath start endpoint (Port / Signal / ClockDomain)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [FalsePath, MulticyclePath]
      target_types: [Port, Signal, ClockDomain]

    to_endpoint:
      description: "SDC FalsePath / MulticyclePath end endpoint (Port / Signal / ClockDomain)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [FalsePath, MulticyclePath]
      target_types: [Port, Signal, ClockDomain]

    groups_clock:
      description: "SDC ClockGroup declares membership of a ClockDomain"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [ClockGroup]
      target_types: [ClockDomain]

    # IP-XACT fusion + composition edges (emitted by IPXACTExtractor).
    specifies:
      description: "An IPXACT_* declarative entity specifies / declares the canonical entity it fuses to (Port / ClockDomain / ResetDomain / CSR_Register / CSR_Field / RTL_Module). Used by the cross-source completeness audit."
      category: structural
      phase: phase_1b
      extraction: parser
      source_types:
        - IPXACT_Component
        - IPXACT_Port
        - IPXACT_Clock
        - IPXACT_Reset
        - IPXACT_Register
        - IPXACT_Field
        - IPXACT_FieldEnum
      target_types:
        - RTL_Module
        - Port
        - ClockDomain
        - ResetDomain
        - CSR_Register
        - CSR_Field
        - CSR_FieldEnum

    has_ipxact_port:
      description: "IPXACT_Component owns an IPXACT_Port (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_Port]

    has_ipxact_register:
      description: "IPXACT_Component owns an IPXACT_Register (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_Register]

    has_ipxact_field:
      description: "IPXACT_Register owns an IPXACT_Field (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Register]
      target_types: [IPXACT_Field]

    has_bus_interface:
      description: "IPXACT_Component owns an IPXACT_BusInterface (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_BusInterface]

    has_address_block:
      description: "IPXACT_Component owns an IPXACT_AddressBlock (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_AddressBlock]

    contains_register:
      description: "IPXACT_AddressBlock contains an IPXACT_Register (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_AddressBlock]
      target_types: [IPXACT_Register]

    has_ipxact_enum:
      description: "IPXACT_Field owns an IPXACT_FieldEnum (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Field]
      target_types: [IPXACT_FieldEnum]

    has_ipxact_parameter:
      description: "IPXACT_Component owns an IPXACT_Parameter (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_Parameter]

    has_ipxact_fileset:
      description: "IPXACT_Component owns an IPXACT_FileSet (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_FileSet]

    parameterizes:
      description: "IPXACT_Parameter parameterizes its fused canonical RTL_Module (cross-source)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Parameter]
      target_types: [RTL_Module]

    implemented_by:
      description: "IPXACT_Component is implemented by an SV_File listed in a <fileSet> (cross-source RTL realization)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [SV_File]

    # IP-XACT Phase-2b bus-interface fusion edges.
    conforms_to:
      description: "IPXACT_BusInterface conforms to a shared IPXACT_BusType protocol (vendor::library::name::version)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_BusInterface]
      target_types: [IPXACT_BusType]

    has_logical_port:
      description: "IPXACT_BusInterface owns an IPXACT_LogicalPort (composition: protocol-side names declared via <portMap>/<logicalPort>)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_BusInterface]
      target_types: [IPXACT_LogicalPort]

    aggregates_port:
      description: "IPXACT_BusInterface aggregates a physical RTL Port (the bus-to-RTL hop; primary completeness-audit edge)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_BusInterface]
      target_types: [Port, IPXACT_Port]

    physical_for:
      description: "IPXACT_LogicalPort maps to a physical RTL Port (logical-to-physical hop; finer-grained than aggregates_port)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_LogicalPort]
      target_types: [Port, IPXACT_Port]

    has_memory_map:
      description: "IPXACT_Component owns an IPXACT_MemoryMap (composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_Component]
      target_types: [IPXACT_MemoryMap]

    contains_address_block:
      description: "IPXACT_MemoryMap contains an IPXACT_AddressBlock (composition; sits between has_memory_map and contains_register)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_MemoryMap]
      target_types: [IPXACT_AddressBlock]

    exposes_memory_map:
      description: "IPXACT_BusInterface (slave) exposes an IPXACT_MemoryMap via <memoryMapRef>"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_BusInterface]
      target_types: [IPXACT_MemoryMap]

    connects_to_address_space:
      description: "IPXACT_BusInterface (master) connects to an IPXACT_AddressSpace via <addressSpaceRef>"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [IPXACT_BusInterface]
      target_types: [IPXACT_AddressSpace]

    tests:
      description: "Testpoint exercises (tests) a named DV test or test class"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Testpoint]
      target_types: [DVTest, TestCase]

    has_stage:
      description: "Testpoint is tagged with a verification lifecycle Stage (V1/V2/V2S/V3)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Testpoint]
      target_types: [Stage]

    covers:
      description: "Testpoint covers a SystemVerilog assertion or RTL module"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Testpoint]
      target_types: [SVA_Assertion, RTL_Module]

    collected_in:
      description: "Covergroup is collected inside a specific RTL module"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Covergroup]
      target_types: [RTL_Module]

    realized_by:
      description: "DVTest is realized (implemented) as a SystemVerilog test file"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [DVTest]
      target_types: [SV_File]

    includes:
      description: "CFile includes another CFile via a local #include directive"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [CFile]
      target_types: [CFile]

    imports_dpi:
      description: "RTL_Module imports a DPI-C boundary function (import DPI-C declaration)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [RTL_Module, Package]
      target_types: [DPIBoundary]

    implements_dpi:
      description: "CFunction implements a DPI-C boundary (C-side golden model function)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [CFunction]
      target_types: [DPIBoundary]

    tests_module:
      description: "SW_Test exercises an RTL_Module through its CSR/mmio interface"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [SW_Test]
      target_types: [RTL_Module]

    accesses_csr:
      description: "SW_Test accesses a CSR_Register via mmio write/read or DIF layer call"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [SW_Test]
      target_types: [CSR_Register]

    has_coverpoint:
      description: "SystemVerilog covergroup contains a coverpoint"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Covergroup_SV]
      target_types: [Coverpoint]

    has_bin:
      description: "Coverpoint contains a bin"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Coverpoint]
      target_types: [CoverBin]

    has_cross:
      description: "SystemVerilog covergroup contains a cross"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Covergroup_SV]
      target_types: [CoverCross]

    has_sample_arg:
      description: "Covergroup_SV composes a formal argument of its `with function sample(...)` subroutine (Composition)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Covergroup_SV]
      target_types: [Covergroup_SampleArg]

    observes:
      description: "Coverpoint samples (observes) a signal, port, or FSM state, or a covergroup sample-function argument"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Coverpoint]
      target_types: [Signal, Port, FSM_State, Covergroup_SampleArg]

    crosses:
      description: "CoverCross combines two or more coverpoints"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [CoverCross]
      target_types: [Coverpoint]

    defined_in:
      description: "Entity is defined inside a container (Covergroup_SV inside RTL_Module; CFunction inside CFile)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [Covergroup_SV, CFunction]
      target_types: [RTL_Module, CFile]

    samples_covergroup:
      description: "UVMSampleCallsite (or wrapper) targets a SystemVerilog Covergroup_SV via .sample() — the audit edge that proves a covergroup is actually exercised"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [UVMSampleCallsite, UVMSampleWrapper]
      target_types: [Covergroup_SV]

    wraps_covergroup:
      description: "UVMSampleWrapper forwards its arguments to a specific Covergroup_SV's `<cg>_inst.sample(...)`"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [UVMSampleWrapper]
      target_types: [Covergroup_SV]

    via_wrapper:
      description: "UVMSampleCallsite reaches a covergroup through a wrapper function (rather than calling .sample directly)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [UVMSampleCallsite]
      target_types: [UVMSampleWrapper]

    defined_in_uvm_file:
      description: "UVMSampleCallsite is anchored to the SV_File where the invocation lives"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [UVMSampleCallsite]
      target_types: [SV_File]

    passes_arg:
      description: "UVMSampleCallsite composes a positional UVMSampleArgExpr (Composition: the callsite owns the per-arg expression)"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [UVMSampleCallsite]
      target_types: [UVMSampleArgExpr]

    binds_to_arg:
      description: "UVMSampleArgExpr binds positionally to a Covergroup_SampleArg of the wrapped covergroup — closes the wrapper-param to covergroup-formal-arg loop"
      category: structural
      phase: phase_1b
      extraction: parser
      source_types: [UVMSampleArgExpr]
      target_types: [Covergroup_SampleArg]

  claim:
    # -----------------------------------------------------------------------
    # Phase-1c claim edges — emitted by SpecClaimExtractor.
    # `claims_about` and `decomposes_into` are composition-shaped (the
    # section/parent owns the claim); the four claim-to-evidence edges are
    # references (the claim points at evidence elsewhere in the graph).
    # -----------------------------------------------------------------------

    claims_about:
      description: "Section asserts a spec-claim node (composition: the section owns the claim)"
      category: claim
      phase: phase_1
      extraction: llm
      source_types: [Section]
      target_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]

    target_entity:
      description: "Spec-claim points at the canonical RTL/spec entity it constrains"
      category: claim
      phase: phase_1
      extraction: llm
      source_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]
      target_types: [RTL_Module, Signal, Port, FSM, Instance, Interface]

    enforced_by:
      description: "Spec-claim is enforced (formally) by an SVA assertion"
      category: claim
      phase: phase_1
      extraction: llm
      source_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]
      target_types: [SVA_Assertion]

    covered_by:
      description: "Spec-claim is covered by a Testpoint in the DV plan"
      category: claim
      phase: phase_1
      extraction: llm
      source_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]
      target_types: [Testpoint]

    measured_by:
      description: "Spec-claim is measured by a Coverpoint or Covergroup"
      category: claim
      phase: phase_1
      extraction: llm
      source_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]
      target_types: [Coverpoint, Covergroup_SV, Covergroup]

    decomposes_into:
      description: "Parent spec-claim refines into a child spec-claim (composition)"
      category: claim
      phase: phase_1
      extraction: llm
      source_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]
      target_types: [StructuralClaim, BehavioralClaim, ProtocolClaim, SecurityClaim]

  semantic:
    # -----------------------------------------------------------------------
    # All semantic edges are Phase 1 — extractable by LLM from prose.
    # -----------------------------------------------------------------------

    specified_by:
      description: "Component or feature is specified by a specification document"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [RTL_Module, IP_Block, Interface, Protocol]
      target_types: [Specification]

    verified_by:
      description: "Component is verified by a test case, assertion, or coverage group"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [RTL_Module, IP_Block, Interface]
      target_types: [TestCase, SVA_Assertion, CoverGroup]

    authored_by:
      description: "Document or component was authored or created by a person"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types:
        - Specification
        - DesignDecision
        - Requirement
        - Script
        - TestCase
      target_types: [Person]

    reviewed_by:
      description: "Document or component was reviewed (and potentially approved) by a person"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types:
        - Specification
        - DesignDecision
        - RTL_Module
        - Review
      target_types: [Person]

    blocks:
      description: "Issue or dependency blocks progress on another item"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [KnownIssue, Requirement, TradeOff]
      target_types:
        - RTL_Module
        - Requirement
        - DesignDecision
        - Project
        - Review

    supersedes:
      description: "Document or version supersedes (replaces) a previous version or decision"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [Specification, Requirement, DesignDecision]
      target_types: [Specification, Requirement, DesignDecision]

    constrained_by:
      description: "Component is constrained by a timing, area, or power constraint"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [RTL_Module, IP_Block, DesignDecision]
      target_types: [TimingConstraint, AreaConstraint, PowerConstraint]

    trades_off_against:
      description: "Design decision trades off one quality attribute against another"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [DesignDecision, TradeOff]
      target_types: [TradeOff, Requirement, TimingConstraint, AreaConstraint, PowerConstraint]

    assumes:
      description: "Design, decision, or specification assumes a precondition or external fact"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [DesignDecision, Specification, Requirement]
      target_types: [Assumption]

    complies_with:
      description: "Component complies with a protocol, standard, or specification"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [RTL_Module, IP_Block, Interface]
      target_types: [Protocol, Specification]

    relates_to:
      description: "Generic semantic relation when no more specific edge type applies"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: []   # unconstrained — any node type
      target_types: []   # unconstrained — any node type

    design_decision_for:
      description: "A design decision applies to or governs a specific component or feature"
      category: semantic
      phase: phase_1
      extraction: llm
      source_types: [DesignDecision]
      target_types:
        - RTL_Module
        - IP_Block
        - Interface
        - Protocol
        - Specification
        - Requirement

  # -------------------------------------------------------------------------
  # v2 AST decomposition layer (phase_2, layer="ast")
  # See docs/v2_dataflow_schema.md § Edge predicates.
  # -------------------------------------------------------------------------
  ast:
    operand:
      description: "Ordered operand of an Operator (or bridge from a Condition stub to its Operator root). Index is carried as edge attribute 'operand_index'."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Operator, Condition]
      target_types: [Operator, Literal, Index, Signal, Port, Condition]

    slice_of:
      description: "Connects an Index node to its base Signal/Port (the signal being bit-/part-selected)."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Index]
      target_types: [Signal, Port]

    slice_msb:
      description: "Index → high-bit expression-node (Literal where resolvable, otherwise an Operator/Index)."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Index]
      target_types: [Literal, Operator, Index, Signal, Port]

    slice_lsb:
      description: "Index → low-bit expression-node (Literal where resolvable, otherwise an Operator/Index)."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Index]
      target_types: [Literal, Operator, Index, Signal, Port]

    condition_of:
      description: "Condition → IfStatement / Branch / Loop the condition gates."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Condition]
      target_types: [IfStatement, Branch, Loop, CaseStatement]

    then_branch:
      description: "IfStatement → Branch for the 'if' arm."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [IfStatement]
      target_types: [Branch]

    elif_branch:
      description: "IfStatement → Branch for each 'else if' arm (ordered)."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [IfStatement]
      target_types: [Branch]

    else_branch:
      description: "IfStatement → Branch for the trailing 'else' arm."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [IfStatement]
      target_types: [Branch]

    case_item:
      description: "CaseStatement → Branch for each non-default case-item (ordered)."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [CaseStatement]
      target_types: [Branch]

    default_branch:
      description: "CaseStatement → Branch for the 'default:' arm."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [CaseStatement]
      target_types: [Branch]

    selector:
      description: "CaseStatement → expression-node feeding the case selector."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [CaseStatement]
      target_types: [Condition, Operator, Literal, Index, Signal, Port]

    case_value:
      description: "Branch → match-value expression-node (one per case-value listed for the arm)."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Branch]
      target_types: [Condition, Literal, Operator, Index]

    body_of:
      description: "Statement → IfStatement / CaseStatement / Loop / Branch — body containment edge into a control-flow construct."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Branch, IfStatement, CaseStatement, Loop, Assignment]
      target_types: [Branch, IfStatement, CaseStatement, Loop, Assignment]

    lhs:
      description: "Assignment → expression-node forming the assignment's LHS."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Assignment]
      target_types: [Condition, Operator, Index, Signal, Port]

    rhs:
      description: "Assignment → expression-node forming the assignment's RHS."
      category: structural
      phase: phase_2
      extraction: parser
      source_types: [Assignment]
      target_types: [Condition, Operator, Literal, Index, Signal, Port]

# ---------------------------------------------------------------------------
# Legacy Compatibility Types
# Mapped from the current regex extractor in src/core/knowledge_graph.py.
# These types may appear in existing graphs; they should be translated to
# canonical schema types at import/merge time.
# ---------------------------------------------------------------------------
legacy_types:
  node_types:
    technology:
      maps_to: RTL_Module   # CamelCase token detection heuristic in regex extractor
      description: "Legacy type emitted by regex extractor for CamelCase tokens; maps to RTL_Module as the most common structural type"

    acronym:
      maps_to: null         # resolved via alias expansion system; no canonical equivalent
      description: "Legacy type emitted by regex extractor for ALL-CAPS tokens; handled by alias/expansion system rather than mapped 1-to-1"

    concept:
      maps_to: null         # generic fallback; destination depends on context
      description: "Legacy type emitted by regex extractor as default fallback; requires reclassification by LLM or manual tagging"

  edge_types:
    is_a:
      maps_to: relates_to
      description: "Legacy generalization edge; maps to relates_to (no subtyping hierarchy in current schema)"

    subset_of:
      maps_to: contains
      description: "Legacy containment/subset edge; maps to contains"

    used_for:
      maps_to: depends_on
      description: "Legacy usage edge; maps to depends_on"

    uses:
      maps_to: depends_on
      description: "Legacy usage edge (alternate form); maps to depends_on"

# ---------------------------------------------------------------------------
